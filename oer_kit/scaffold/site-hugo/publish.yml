name: publish

# main への push でサイトを生成し GitHub Pages へ配信する (Hugo エンジン)。
# 事前に Settings → Pages → Source を「GitHub Actions」にしておくこと
# (config.yaml の base_url も公開URLに合わせる。docs/user-guide.md §6)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # oer-kit を fork して使う場合はここを自分のリポジトリに変更する
      - run: pip install "oer-kit @ git+https://github.com/takedatoshiyuki/oer-kit"
      # 数式 (transform.ToMath) に Hugo 0.132 以上が必要。検証済みの版に固定
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true
      - name: サイト生成（検証 → prerender → hugo → catalog）
        run: make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
