# ⚠ site/hugo.yaml は oer_kit.prerender がこのテンプレートと config.yaml から生成する。
# 設定を変えるときはこのファイルを編集して prerender を再実行すること ({{...}} は config.yaml の値)。
baseURL: "{{base_url}}"
title: "{{site_name}}"
languageCode: "{{lang}}"

# プロジェクト内 (site/_site) に出力し、Makefile の render で _site/ へ同期する
publishDir: _site

taxonomies:
  category: categories

markup:
  goldmark:
    renderer:
      unsafe: true      # prerender 生成の Markdown のみをビルドする前提 (任意入力は通さない)
    extensions:
      # 数式 (LaTeX)。render-passthrough フックが transform.ToMath で
      # ビルド時に MathML へ変換する (クライアント JS 不要)
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]

outputs:
  home: [HTML, searchindex]
outputFormats:
  searchindex:
    mediaType: application/json
    baseName: searchindex
    isPlainText: true

disableKinds: [rss]

params:
  feedback_url: "{{feedback_url}}"
