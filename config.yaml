# リポジトリ全体の設定。公開URLが確定したら base_url をここだけ変更する (docs/design.md §4.1)。
site_name: OER リポジトリ（仮称）
base_url: https://oer.example.ac.jp
primary_language: ja

# クローラの礼儀設定 (tools/discover.py, fetch.py, wayback.py が使用)
crawler:
  user_agent: oer-repo-tools/0.1
  sleep_seconds: 1.0

# 自作共有ライブラリの場所 (common_knowledge: Playwright取得等)
lib_paths:
  - ~/Applications/lib/python
