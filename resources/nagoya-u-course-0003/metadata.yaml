name:
  ja: ジェンダーとセクシュアリティ
description:
  ja: 父・母・子の三角関係として成立するファミリー・ロマンスを手がかりに、家族の成り立ちを考察する講義である。レヴィ＝ストロースの家族構造論と精神分析理論を導入し、その後、脱構築、言説理論、クィア理論によって既存の家族像を問い直し、クィア・ファミリーという家族像を提示する。
quotedDescription:
  text:
    ja: 父、母、子という三角関係によって成り立つファミリー・ロマンスは、どのようにして生まれたのか？なぜ、父、母、子でなければならないのか？そこに存在する法則とは何か？これらの問題を考えるために、授業では、まずレヴィ＝ストロースによる家族構造の考察と、精神分析理論における父、母、子の関係を紹介する。その後で、ファミリー・ロマンスの解体に向けて、脱構築と言説理論およびクィア理論の可能性をそれぞれ模索する。そうすることにより、脱ファミリー・ロマンス後の家族像を、新たに「クィア・ファミリー」として提示し、その可能性を考えてみたい。
