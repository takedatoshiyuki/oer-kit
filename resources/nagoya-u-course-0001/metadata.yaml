  ja: 生命農学基礎講義
  en: Basics of Bioagricultural Sciences
description:
  ja: 脂質の生化学とバイオテクノロジーを、生物資源利用の観点から扱う講義である。教材は、脂質化学の基礎から、油脂の化学的・酵素的修飾、他の脂質の生体触媒変換、リパーゼを用いた有機合成までを章ごとに整理している。講義ノートと課題が公開されている。
quotedDescription:
  text:
    ja: '脂質関連の生化学・バイオテクノロジーについて、生物資源利用という観点から概説する。

      Biochemistry and biotechnology of lipids are outlined from the view point of bio-resource utilization.

      生命農学分野に関連した特定のトピックについて基礎的な講義を行う。

      本年度は糖質・蛋白質と並ぶ三大栄養素である脂質関連の生化学・バイオテクノロジーについて、生物資源利用という観点から概説する。

      授業には主として英語を用い、WEB システムを介した履修システムを活用する。

      This course offers some topics related to the field of Bioagricultural Sciences.

      In this year, biochemistry and biotechnology of lipids, which are one of the three main classes
      of nutrient along with carbohydrates and proteins, are outlined from the view oint of bio-resource
      utilization.

      The class is given mainly in English with the help of WEB learning system.'
