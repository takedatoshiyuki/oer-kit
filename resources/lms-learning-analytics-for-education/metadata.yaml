name:
  ja: LMSログから学習と授業を読み解く
  en: Reading Learning and Teaching Through LMS Logs
alternateName:
  ja: 教育改善のためのラーニングアナリティクス 初級・中級・修士発展
description:
  ja: >-
    大学教員・教育支援者と心理・教育系修士1年を対象に、LMSログを授業改善、学生支援、
    教育研究へ結びつける方法を学ぶ9時間の実習教材。
    初級編では授業設計とログの対応、可視化、教育的解釈を扱い、中級編では構成概念、早期支援、
    介入評価、公平性を扱う。修士発展編では理論、妥当性、研究質問、混合研究法、ロジックモデル、
    評価デザイン、倫理・データ管理を扱う。合成データ、Rスクリプト、演習、解答例、講師ガイドを含む。
  en: >-
    A nine-hour practical course for higher-education instructors, educational support staff, and first-year
    master's students in psychology and education. It connects LMS logs with course improvement, student support,
    research design, construct validity, intervention logic, and evaluation. It includes synthetic data, R scripts,
    exercises, suggested responses, and a facilitator guide.
